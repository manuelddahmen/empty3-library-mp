tasks.register('extractDeps', Jar) {
    archiveFileName = 'empty3-library-mp-with-dependencies.jar'
    destinationDirectory = file('build/libs')

    // Activer Zip64 pour gérer plus de 65535 entrées
    zip64 = true

    // Inclure le contenu de toutes les dépendances
    from {
        configurations.runtimeClasspath.collect { zipTree(it) }
    }

    // Inclure vos classes compilées (optionnel)
    from sourceSets.main.output

    // Exclure les fichiers qui peuvent causer des conflits
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/license*'
    exclude 'META-INF/NOTICE*'

    // Stratégie pour les fichiers dupliqués
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
